name: indirim_radari
description: "İndirim Kapısı - Market Kampanyaları"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  google_mobile_ads: ^5.3.0
  http: ^1.2.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ustbanner.jpeg
    - assets/guncelustbanner.jpeg
    - assets/ikon.jpg
    - assets/adi-registration.properties
    - assets/agent.jpeg
    - assets/robot.jpeg
    - assets/guncelrobot.jpeg
